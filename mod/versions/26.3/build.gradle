plugins { id 'net.fabricmc.fabric-loom' version '1.18.4' }
base { archivesName = 'sol-sanctum-halloween-26.3' }
repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.20.1'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.165.0+26.3'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
sourceSets {
    main { java.srcDir rootProject.file('common/src/main/java'); resources.srcDir rootProject.file('common/src/main/resources') }
    test { java.srcDir rootProject.file('common/src/test/java') }
}
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25; withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand(version: project.version, minecraft: '26.3', java: '25', api: '0.165.0+26.3') }
}
test { useJUnitPlatform() }
jar { from(rootProject.file('LICENSE')) }

// Optional real-client integration tests. The test mod is never included in the release jar.
if (providers.gradleProperty('gameTests').isPresent()) {
    fabricApi.configureTests {
        createSourceSet = true
        modId = 'elysium_halloween_test'
        enableGameTests = false
        enableClientGameTests = true
    }
}
